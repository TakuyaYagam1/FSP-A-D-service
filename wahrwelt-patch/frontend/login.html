<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Вход - Wahrwelt</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/auth.js" defer></script>
  </head>
  <body class="auth-page" data-auth-page="login">
    <header class="topbar auth-topbar">
      <a class="brand" href="/" aria-label="Wahrwelt"><img class="brand-logo" src="/logo.jpg" width="52" height="42" alt=""><span>Wahrwelt</span></a>
      <span class="product-label">Торговый контур</span>
      <a class="topbar-link" href="/register">Регистрация</a>
    </header>

    <main class="auth-layout">
      <section class="auth-intro">
        <p class="eyebrow">Орловская крепость</p>
        <h1>Линии<br>снабжения.</h1>
        <p class="intro-copy">Войдите в штабную систему, чтобы оформлять поставки и согласовывать движение между пятью городами.</p>
      </section>

      <section class="auth-card" aria-labelledby="login-heading">
        <div class="auth-card-heading">
          <p class="eyebrow">Доступ к контуру</p>
          <h2 id="login-heading">Вход</h2>
          <p>Используйте учетную запись участника торгового маршрута.</p>
        </div>

        <form id="auth-form" class="auth-form">
          <label>Имя пользователя
            <input name="username" autocomplete="username" minlength="3" maxlength="32" autofocus required>
          </label>
          <label>Пароль
            <input name="password" type="password" autocomplete="current-password" minlength="1" maxlength="72" required>
          </label>
          <button class="button auth-submit" type="submit">Войти</button>
        </form>

        <p id="auth-notice" class="auth-notice" role="status" aria-live="polite"></p>
        <p class="auth-switch">Нет учетной записи? <a href="/register">Зарегистрироваться</a></p>
      </section>
    </main>
  </body>
</html>
