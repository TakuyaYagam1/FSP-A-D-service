version: "2"
sql:
  - engine: postgresql
    schema: ../db/migrations
    queries: ../db/queries
    gen:
      go:
        package: sqlc
        out: ../internal/adapter/secondary/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        overrides:
          - db_type: uuid
            go_type:
              import: uuid
              package: uuid
              type: UUID
