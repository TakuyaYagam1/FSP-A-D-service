        amount:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, paid]
        created_at:
          type: string
          format: date-time
    Invoice:
      type: object
      required: [invoice_number, amount, status, payment_ref, created_at]
      properties:
        invoice_number:
          type: string
        amount:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, paid]
        payment_ref:
          type: string
          format: password
        created_at:
          type: string
          format: date-time
    InvoiceSearchItem:
      type: object
