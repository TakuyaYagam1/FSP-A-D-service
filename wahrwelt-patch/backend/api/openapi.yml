      properties:
        serial:
          type: string
          pattern: '^CRT-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
        registry_url:
          type: string
          format: uri
    VerifyCertificateResponse:
      type: object
      required: [serial, body]
      properties:
        serial:
          type: string
        body:
          type: string
    CertificateProof:
      type: object
      required: [origin_phrase]
      properties:
        origin_phrase:
          type: string
          format: password
    CreateInvoiceRequest:
      type: object
      additionalProperties: false
      required: [amount, payment_ref]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
        payment_ref:
          type: string
          minLength: 1
          maxLength: 240
          format: password
    InvoiceSummary:
      type: object
      required: [invoice_number, amount, status, created_at]
