openapi: 3.2.0
info:
  title: Wahrwelt API
  version: 1.0.0
  description: API for cases and route slot approvals.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: health
      summary: Check service health
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/register:
    post:
      operationId: register
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/login:
    post:
      operationId: login
      summary: Start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session started.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/logout:
    post:
      operationId: logout
      summary: End the current session
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Session ended.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Read the current user
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users available for route assignments
      security:
        - SessionCookie: []
      responses:
        '200':
          description: User directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDirectory'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/cases:
    post:
      operationId: createCase
      summary: Create a case
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Case created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/cases/{case_id}:
    get:
      operationId: getCase
      summary: Read an owned case
      security:
        - SessionCookie: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Case details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/cases/{case_id}/route-slots:
    post:
      operationId: createRouteSlot
      summary: Create a route slot for an owned case
      security:
        - SessionCookie: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteSlotRequest'
      responses:
        '201':
          description: Route slot created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteSlot'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/route-slots/{slot_id}/approvals:
    post:
      operationId: approveRouteSlot
      summary: Record an approval for an assigned role
      security:
        - SessionCookie: []
      parameters:
        - name: slot_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Accepted role and route slot readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalState'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/route-slots/{slot_id}/code:
    get:
      operationId: getRouteSlotCode
      summary: Read the slot code as owner or approved participant
      security:
        - SessionCookie: []
      parameters:
        - name: slot_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Route slot code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteSlotCode'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/manifests:
    post:
      operationId: createManifest
      summary: Create an import manifest and its first revision
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManifestRequest'
      responses:
        '201':
          description: Manifest and first revision created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestCreated'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/manifests/{manifest_number}:
    get:
      operationId: getManifest
      summary: Read the public manifest card
      parameters:
        - name: manifest_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^MNF-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Public manifest card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestCard'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/manifests/{manifest_number}/revisions:
    get:
      operationId: listManifestRevisions
      summary: Read the public revision history
      parameters:
        - name: manifest_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^MNF-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Public revision history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestHistory'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/manifests/{manifest_number}/revisions/{revision_id}:
    get:
      operationId: getManifestRevision
      summary: Read a manifest revision
      security:
        - SessionCookie: []
      parameters:
        - name: manifest_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^MNF-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Manifest revision details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestRevision'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/certificates:
    post:
      operationId: createCertificate
      summary: Create a certificate
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificateRequest'
      responses:
        '201':
          description: Certificate created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/certificates/{serial}:
    get:
      operationId: getCertificate
      summary: Read a certificate
      security:
        - SessionCookie: []
      parameters:
        - name: serial
          in: path
          required: true
          schema:
            type: string
            pattern: '^CRT-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Certificate details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/certificates/verify:
    post:
      operationId: verifyCertificate
      summary: Verify a certificate registry record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCertificateRequest'
      responses:
        '200':
          description: Registry response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyCertificateResponse'
        default:
          $ref: '#/components/responses/Error'
  /internal/certificates/{serial}/proof:
    get:
      operationId: getInternalCertificateProof
      summary: Read a certificate proof
      parameters:
        - name: serial
          in: path
          required: true
          schema:
            type: string
            pattern: '^CRT-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Certificate proof details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateProof'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/invoices:
    post:
      operationId: createInvoice
      summary: Create an invoice
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        '201':
          description: Invoice created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSummary'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/invoices/search:
    get:
      operationId: searchInvoices
      summary: Search invoices
      security:
        - SessionCookie: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        '200':
          description: Matching invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSearchResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/invoices/{invoice_number}:
    get:
      operationId: getInvoice
      summary: Read an owned invoice
      security:
        - SessionCookie: []
      parameters:
        - name: invoice_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^INV-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Invoice details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/inspections:
    post:
      operationId: createInspection
      summary: Create an inspection for a case
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInspectionRequest'
      responses:
        '201':
          description: Inspection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionCreated'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/inspections/{inspection_number}:
    get:
      operationId: getInspection
      summary: Read an inspection card
      parameters:
        - name: inspection_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^INSP-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Inspection card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionCard'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/inspections/{inspection_number}/note:
    get:
      operationId: getInspectionNote
      summary: Read an assigned inspection note
      security:
        - SessionCookie: []
      parameters:
        - name: inspection_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^INSP-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Inspection note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionNote'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/inspections/{inspection_number}/comments:
    post:
      operationId: addInspectionComment
      summary: Add an inspection comment
      security:
        - SessionCookie: []
      parameters:
        - name: inspection_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^INSP-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInspectionCommentRequest'
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionComment'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/licenses:
    post:
      operationId: createLicense
      summary: Create an export license
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLicenseRequest'
      responses:
        '201':
          description: License created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseCreated'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/licenses/{license_number}/card:
    get:
      operationId: getLicenseCard
      summary: Read a public license card
      parameters:
        - name: license_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^LIC-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Public license card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseCard'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/licenses/{license_number}:
    get:
      operationId: getLicense
      summary: Read an owned license
      security:
        - SessionCookie: []
      parameters:
        - name: license_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^LIC-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Full license details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/License'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/licenses/{license_number}/tokens:
    post:
      operationId: issueLicenseToken
      summary: Issue a short-lived license access token
      security:
        - SessionCookie: []
      parameters:
        - name: license_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^LIC-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseTokenRequest'
      responses:
        '201':
          description: Access token issued.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseToken'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/licenses/{license_number}/release-pin:
    get:
      operationId: getLicenseReleasePin
      summary: Read a license release pin with an access token
      security:
        - LicenseReadToken: []
      parameters:
        - name: license_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^LIC-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: License release pin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseReleasePin'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/contracts:
    post:
      operationId: createContract
      summary: Create a service contract
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Contract created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCreated'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/contracts/{contract_number}/card:
    get:
      operationId: getContractCard
      summary: Read a public contract card
      parameters:
        - name: contract_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^CTR-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Public contract card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCard'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/contracts/{contract_number}:
    get:
      operationId: getContract
      summary: Read an owned contract
      security:
        - SessionCookie: []
      parameters:
        - name: contract_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^CTR-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Full contract details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/contracts/{contract_number}/preview:
    post:
      operationId: previewContract
      summary: Render a contract preview
      parameters:
        - name: contract_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^CTR-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractPreviewRequest'
      responses:
        '200':
          description: Rendered contract preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPreview'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/quotas:
    post:
      operationId: createQuota
      summary: Create a quota
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuotaRequest'
      responses:
        '201':
          description: Quota created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaCreated'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/quotas/{quota_number}:
    get:
      operationId: getQuota
      summary: Read an owned quota
      security:
        - SessionCookie: []
      parameters:
        - name: quota_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^QUO-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      responses:
        '200':
          description: Full quota details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quota'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/quotas/{quota_number}/summary:
    get:
      operationId: getQuotaSummary
      summary: Read selected quota summary fields
      parameters:
        - name: quota_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^QUO-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
        - name: fields
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Selected quota fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaSummary'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/archive-waybills:
    post:
      operationId: createWaybill
      summary: Create an archive waybill
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWaybillRequest'
      responses:
        '201':
          description: Waybill created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaybillCreated'
        default:
          $ref: '#/components/responses/Error'
