components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
    LicenseReadToken:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_request, unauthorized, forbidden, not_found, conflict, approval_not_ready, internal_error]
        message:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_.-]+$'
        password:
          type: string
          minLength: 10
          maxLength: 72
          format: password
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_.-]+$'
        password:
          type: string
          minLength: 1
          maxLength: 72
          format: password
    User:
      type: object
      required: [user_id, username]
      properties:
        user_id:
          type: string
          pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
        username:
          type: string
    UserDirectory:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/UserOption'
    UserOption:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [kind, origin, destination]
      properties:
        kind:
          type: string
          enum: [import, export, service]
        origin:
          type: string
          minLength: 1
          maxLength: 120
        destination:
          type: string
          minLength: 1
          maxLength: 120
    Case:
      type: object
      required: [case_id, owner_id, kind, origin, destination, created_at]
      properties:
        case_id:
          type: string
          pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
        owner_id:
          type: string
          pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
        kind:
          type: string
          enum: [import, export, service]
        origin:
          type: string
        destination:
          type: string
        created_at:
          type: string
          format: date-time
    CreateRouteSlotRequest:
      type: object
      additionalProperties: false
      required: [carrier_username, inspector_username, slot_code]
      properties:
        carrier_username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_.-]+$'
        inspector_username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_.-]+$'
        slot_code:
          type: string
          minLength: 1
          maxLength: 120
          writeOnly: true
          format: password
    RouteSlot:
      type: object
      required: [route_slot_id, case_id, carrier_username, inspector_username, created_at]
      properties:
        route_slot_id:
          type: string
          pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
        case_id:
          type: string
          pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
        carrier_username:
          type: string
        inspector_username:
          type: string
        created_at:
          type: string
          format: date-time
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [carrier, inspector]
    ApprovalState:
      type: object
      required: [carrier_approved, inspector_approved, ready]
      properties:
        carrier_approved:
          type: boolean
        inspector_approved:
          type: boolean
        ready:
          type: boolean
    RouteSlotCode:
      type: object
      required: [slot_code]
      properties:
        slot_code:
          type: string
          format: password
    CreateManifestRequest:
      type: object
      additionalProperties: false
      required: [origin, destination, sealed_route]
      properties:
        origin:
          type: string
          minLength: 1
          maxLength: 120
        destination:
          type: string
          minLength: 1
          maxLength: 120
        sealed_route:
          type: string
          minLength: 1
          maxLength: 240
          format: password
    ManifestCreated:
      type: object
      required: [manifest_number, revision_id, status]
      properties:
        manifest_number:
          type: string
        revision_id:
          type: string
        status:
          type: string
          enum: [received, in_review, released]
    ManifestCard:
      type: object
      required: [manifest_number, status]
      properties:
        manifest_number:
          type: string
        status:
          type: string
          enum: [received, in_review, released]
    RevisionSummary:
      type: object
      required: [revision_id, status]
      properties:
        revision_id:
          type: string
        status:
          type: string
          enum: [received, in_review, released]
    ManifestHistory:
      type: object
      required: [manifest_number, revisions]
      properties:
        manifest_number:
          type: string
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/RevisionSummary'
    ManifestRevision:
      type: object
      required: [manifest_number, revision_id, status, sealed_route, created_at]
      properties:
        manifest_number:
          type: string
        revision_id:
          type: string
        status:
          type: string
          enum: [received, in_review, released]
        sealed_route:
          type: string
          format: password
        created_at:
          type: string
          format: date-time
    CreateCertificateRequest:
      type: object
      additionalProperties: false
      required: [origin_phrase]
      properties:
        origin_phrase:
          type: string
          minLength: 1
          maxLength: 240
          format: password
    Certificate:
      type: object
      required: [serial, origin_phrase, created_at]
      properties:
        serial:
          type: string
          pattern: '^CRT-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
        origin_phrase:
          type: string
          format: password
        created_at:
          type: string
          format: date-time
    VerifyCertificateRequest:
      type: object
