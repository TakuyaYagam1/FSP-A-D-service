<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Регистрация - Wahrwelt</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
    <script src="/auth.js" defer></script>
  </head>
  <body class="auth-page" data-auth-page="register">
    <header class="topbar auth-topbar">
      <a class="brand" href="/" aria-label="Wahrwelt"><img class="brand-logo" src="/logo.jpg" width="60" height="48" alt=""><span>Wahrwelt</span></a>
      <a class="topbar-link" href="/login">Войти</a>
    </header>

    <main class="auth-layout">
      <section class="auth-intro">
        <h1>Мониторинг логистики</h1>
        <p class="intro-copy">Строительство узла Рассвет</p>
      </section>

      <section class="auth-card" aria-labelledby="register-heading">
        <div class="auth-card-heading">
          <h2 id="register-heading">Создать учетную запись</h2>
        </div>

        <form id="auth-form" class="auth-form">
          <label>Имя пользователя
            <input name="username" autocomplete="username" minlength="3" maxlength="32" autofocus required>
          </label>
          <label>Пароль
            <input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
          </label>
          <p class="field-hint">От 10 до 72 символов.</p>
          <button class="button auth-submit" type="submit">Создать учетную запись</button>
        </form>

        <p id="auth-notice" class="auth-notice" role="status" aria-live="polite"></p>
        <p class="auth-switch">Уже зарегистрированы? <a href="/login">Войти</a></p>
      </section>
    </main>
  </body>
</html>
